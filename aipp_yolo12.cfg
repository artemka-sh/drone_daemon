aipp_op {
    aipp_mode: static
    input_format : RGB888_U8

    src_image_size_w : 640
    src_image_size_h : 640

    csc_switch : false
    # Наш хостовый буфер — BGR (так отдаёт OpenCV/cv::Mat). Свап каналов
    # делаем прямо тут, чтобы на CPU-стороне (Preprocess) ничего лишнего
    # не конвертировать.
    rbuv_swap_switch : true

    mean_chn_0 : 0
    mean_chn_1 : 0
    mean_chn_2 : 0
    min_chn_0 : 0.0
    min_chn_1 : 0.0
    min_chn_2 : 0.0

    # 1/255 — приводим uint8 [0..255] к float [0..1], как ждёт модель
    var_reci_chn_0 : 0.0039215686274509803921568627451
    var_reci_chn_1 : 0.0039215686274509803921568627451
    var_reci_chn_2 : 0.0039215686274509803921568627451
}
